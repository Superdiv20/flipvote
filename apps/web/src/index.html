<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flipvote</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Before first paint, so a dark visitor doesn't see the prerendered landing page flash light. Mirrors ThemeService. -->
    <script>
      try {
        var theme = localStorage.getItem('flipvote.theme');
        if (
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        )
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <flipvote-root></flipvote-root>
  </body>
</html>
